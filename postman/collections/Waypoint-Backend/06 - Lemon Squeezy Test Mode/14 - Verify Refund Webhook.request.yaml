$kind: http-request
description: Diagnostic verification for the Lemon Squeezy subscription_payment_refunded webhook. Fetches refund webhook rows without pre-filtering by processing status or external object ID so the exact stored event can be inspected reliably.
url: "{{baseUrl}}/api/v1/admin/webhook-events?eventName=subscription_payment_refunded&size=50&sort=receivedAt&direction=DESC&includePayload=false"
method: GET
headers:
  Authorization: Basic {{adminBasicAuth}}
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      if (!adminId || !adminPassword) {
          throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      }
      if (!pm.environment.get('lemonSqueezyInvoiceId')) {
          throw new Error('Run 11 - List Subscription Invoices and 12 - Refund Selected Invoice first.');
      }
      pm.variables.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const invoiceId = String(pm.environment.get('lemonSqueezyInvoiceId'));
      const refundEvents = body.items || [];
      pm.test('At least one refund webhook was recorded', () => {
        pm.expect(refundEvents, 'No subscription_payment_refunded webhook rows were stored').to.be.an('array').and.not.empty;
      });
      const exactEvent = refundEvents.find(item => String(item.externalObjectId) === invoiceId);
      if (exactEvent) {
        pm.test('Refund webhook for selected invoice was processed', () => {
          pm.expect(exactEvent.processingStatus).to.eql('PROCESSED');
        });
      }
    language: text/javascript
order: 14000
