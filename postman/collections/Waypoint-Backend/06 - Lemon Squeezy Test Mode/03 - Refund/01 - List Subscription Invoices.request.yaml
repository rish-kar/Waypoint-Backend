$kind: http-request
description: Lists invoices for the locked paid no-trial Test Mode lifecycle subscription and stores the newest positive-value paid, non-refunded invoice for refund testing.
url: "https://api.lemonsqueezy.com/v1/subscription-invoices?filter[subscription_id]={{lemonSqueezyLifecycleSubscriptionId}}"
method: GET
headers:
  Authorization: Bearer {{lemonSqueezyApiKey}}
  Accept: application/vnd.api+json
  Content-Type: application/vnd.api+json
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('lemonSqueezyApiKey')) {
        throw new Error('Set lemonSqueezyApiKey in the Waypoint Local environment.');
      }
      if (!pm.environment.get('lemonSqueezyLifecycleSubscriptionId')) {
        throw new Error('Run 04 for a fresh run or 08A to recover an interrupted run.');
      }
      if (pm.environment.get('lemonSqueezyNoTrialPaidReady') !== 'true') {
        throw new Error('This test requires the clean paid no-trial subscription created in this folder.');
      }
      pm.environment.unset('lemonSqueezyInvoiceId');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Invoice list returned', () => pm.expect(body.data).to.be.an('array'));
      const subscriptionId = pm.environment.get('lemonSqueezyLifecycleSubscriptionId');
      const refundableInvoice = body.data.find(invoice => {
        const attributes = invoice.attributes || {};
        return String(attributes.subscription_id) === String(subscriptionId)
          && attributes.test_mode === true
          && attributes.status === 'paid'
          && attributes.refunded !== true
          && Number(attributes.total) > 0;
      });
      pm.test('A positive-value paid non-refunded test invoice is available', () => {
        pm.expect(refundableInvoice, 'No positive-value paid non-refunded test invoice found').to.exist;
      });
      if (refundableInvoice) {
        pm.environment.set('lemonSqueezyInvoiceId', refundableInvoice.id);
      }
    language: text/javascript
order: 11000
