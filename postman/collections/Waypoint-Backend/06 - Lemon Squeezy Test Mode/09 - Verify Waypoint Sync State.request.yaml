$kind: http-request
description: Checks Waypoint's database for the subscription matching the current Lemon Squeezy lifecycle state. It also restores the lifecycle subscription ID if another Waypoint request selected an older subscription.
url: "{{baseUrl}}/api/v1/admin/subscriptions?userId={{userId}}&size=50&sort=updatedAt&direction=DESC"
method: GET
headers:
  Authorization: Basic {{adminBasicAuth}}
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      if (!adminId || !adminPassword) {
          throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      }
      if (!pm.environment.get('userId')) {
          throw new Error('Run Google Login first so userId is populated.');
      }
      if (!pm.environment.get('lemonSqueezyProviderStatus')) {
          throw new Error('Run the relevant Lemon Squeezy provider action first.');
      }
      pm.variables.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const expectedStatus = pm.environment.get('lemonSqueezyProviderStatus').toUpperCase();
      const bootstrapId = pm.environment.get('lemonSqueezyBootstrapSubscriptionId');
      const matching = (body.items || []).find(item =>
        item.provider === 'LEMON_SQUEEZY'
        && item.status === expectedStatus
        && item.externalSubscriptionId
        && (!bootstrapId || item.externalSubscriptionId !== bootstrapId)
      );
      pm.test('Lifecycle subscription with matching Waypoint state exists', () => {
        pm.expect(matching, `No ${expectedStatus} Lemon Squeezy lifecycle subscription found`).to.exist;
      });
      if (matching) {
        pm.environment.set('lemonSqueezySubscriptionId', matching.externalSubscriptionId);
        pm.test('Waypoint status matches Lemon Squeezy provider status', () => {
          pm.expect(matching.status).to.eql(expectedStatus);
        });
      }
    language: text/javascript
order: 9000
