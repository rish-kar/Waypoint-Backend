$kind: http-request
description: Pauses payment collection in void mode for the ACTIVE paid no-trial Test Mode subscription.
url: "https://api.lemonsqueezy.com/v1/subscriptions/{{lemonSqueezySubscriptionId}}"
method: PATCH
headers:
  Authorization: Bearer {{lemonSqueezyApiKey}}
  Accept: application/vnd.api+json
  Content-Type: application/vnd.api+json
body:
  type: json
  content: |-
    {
      "data": {
        "type": "subscriptions",
        "id": "{{lemonSqueezySubscriptionId}}",
        "attributes": {
          "pause": {
            "mode": "void"
          }
        }
      }
    }
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('lemonSqueezyApiKey')) {
        throw new Error('Set lemonSqueezyApiKey in the Waypoint Local environment.');
      }
      if (!pm.environment.get('lemonSqueezySubscriptionId')) {
        throw new Error('Run 04 - Capture New Paid Subscription first.');
      }
      if (pm.environment.get('lemonSqueezyProviderStatus') !== 'active') {
        throw new Error('08 - Pause Subscription requires provider status active. Run 07 - Resume Paid Subscription first.');
      }
      if (pm.environment.get('lemonSqueezyNoTrialPaidReady') !== 'true') {
        throw new Error('This test requires the clean paid no-trial subscription created in this folder.');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const attributes = pm.response.json().data.attributes;
      pm.test('Subscription is test-mode data', () => pm.expect(attributes.test_mode).to.eql(true));
      pm.test('Provider marks subscription paused in void mode', () => {
        pm.expect(attributes.status).to.eql('paused');
        pm.expect(attributes.pause).to.be.an('object');
        pm.expect(attributes.pause.mode).to.eql('void');
        pm.expect(attributes.trial_ends_at).to.eql(null);
      });
      pm.environment.set('lemonSqueezyProviderStatus', attributes.status || '');
    language: text/javascript
order: 8000
