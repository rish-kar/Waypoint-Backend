$kind: http-request
description: Recovery helper for an interrupted lifecycle run. Finds the newest paid no-trial Lemon Squeezy Test Mode subscription for this test user and locks it as the lifecycle subscription. It does not depend on earlier bootstrap variables.
url: "https://api.lemonsqueezy.com/v1/subscriptions?filter[store_id]={{lemonSqueezyStoreId}}&filter[user_email]={{userEmail}}&page[size]=100"
method: GET
headers:
  Authorization: Bearer {{lemonSqueezyApiKey}}
  Accept: application/vnd.api+json
  Content-Type: application/vnd.api+json
scripts:
  - type: beforeRequest
    code: |-
      const required = ['lemonSqueezyApiKey', 'lemonSqueezyStoreId', 'userEmail'];
      required.forEach(key => {
        if (!pm.environment.get(key)) {
          throw new Error(`Missing ${key}.`);
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const expectedProviderStatus = pm.environment.get('lemonSqueezyProviderStatus');
      const variantId = pm.environment.get('lemonSqueezyVariantId');
      const candidates = (body.data || [])
        .filter(item => {
          const attributes = item.attributes || {};
          return attributes.test_mode === true
            && attributes.trial_ends_at === null
            && (!variantId || String(attributes.variant_id) === String(variantId));
        })
        .sort((a, b) => Date.parse(b.attributes?.updated_at || b.attributes?.created_at || 0) - Date.parse(a.attributes?.updated_at || a.attributes?.created_at || 0));
      const recovered = candidates.find(item => item.attributes?.status === expectedProviderStatus) || candidates[0];
      pm.test('Paid no-trial lifecycle subscription can be recovered', () => {
        pm.expect(recovered, 'No paid no-trial lifecycle subscription found').to.exist;
      });
      if (recovered) {
        pm.environment.set('lemonSqueezyLifecycleSubscriptionId', recovered.id);
        pm.environment.set('lemonSqueezySubscriptionId', recovered.id);
        pm.environment.set('lemonSqueezyProviderStatus', recovered.attributes?.status || '');
        pm.environment.set('lemonSqueezyNoTrialPaidReady', 'true');
      }
    language: text/javascript
order: 8500
