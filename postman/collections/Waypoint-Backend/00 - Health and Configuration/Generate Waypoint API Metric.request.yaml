$kind: http-request
url: "{{baseUrl}}/api/v1/ai/models"
method: GET
description: Calls a safe public Waypoint API endpoint so the subsequent Prometheus scrape can verify Waypoint custom request metrics.
headers:
  X-Request-ID: postman-metrics-sample
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Request ID returned', () => pm.expect(pm.response.headers.get('X-Request-ID')).to.eql('postman-metrics-sample'));
    language: text/javascript
order: 6000
