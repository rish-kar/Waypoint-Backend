$kind: http-request
url: "{{baseUrl}}/actuator/prometheus"
method: GET
description: Scrapes Prometheus metrics using the same admin ID and password as the existing Admin requests.
headers:
  Authorization: Basic {{adminBasicAuth}}
  Accept: text/plain
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      if (!adminId || !adminPassword) {
          throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      }
      pm.environment.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const contentType = pm.response.headers.get('Content-Type') || '';
      const text = pm.response.text();
      pm.test('Prometheus text response returned', () => pm.expect(contentType).to.include('text/plain'));
      pm.test('JVM metrics are present', () => pm.expect(text).to.include('jvm_memory_used_bytes'));
      pm.test('HTTP server metrics are present', () => pm.expect(text).to.include('http_server_requests_seconds_count'));
      pm.test('Waypoint request counter is present', () => pm.expect(text).to.include('waypoint_api_requests_total'));
      pm.test('Waypoint request duration is present', () => pm.expect(text).to.include('waypoint_api_request_duration_seconds'));
    language: text/javascript
order: 7000
