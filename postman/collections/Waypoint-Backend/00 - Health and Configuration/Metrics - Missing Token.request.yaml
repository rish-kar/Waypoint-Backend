$kind: http-request
url: "{{baseUrl}}/actuator/prometheus"
method: GET
description: Verifies that the protected Prometheus endpoint rejects requests without the dedicated monitoring bearer token.
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 401', () => pm.response.to.have.status(401));
      const body = pm.response.json();
      pm.test('Metrics authentication is required', () => {
        pm.expect(body.code).to.eql('UNAUTHORIZED');
        pm.expect(body.message).to.eql('Metrics authentication required');
      });
    language: text/javascript
order: 4000
