$kind: http-request
url: "{{baseUrl}}/actuator/health/liveness"
method: GET
headers:
  X-Request-ID: postman-liveness
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Health is UP', () => pm.expect(pm.response.json().status).to.eql('UP'));
      pm.test('Request ID returned', () => pm.expect(pm.response.headers.get('X-Request-ID')).to.eql('postman-liveness'));
    language: text/javascript
order: 2000
