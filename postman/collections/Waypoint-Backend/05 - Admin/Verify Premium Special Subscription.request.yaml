$kind: http-request
url: "{{baseUrl}}/api/v1/subscriptions/current"
method: GET
headers:
  Authorization: Bearer {{jwt}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Premium Special is effective', () => {
          pm.expect(body.plan).to.eql('PREMIUM_SPECIAL');
          pm.expect(body.status).to.eql('PREMIUM_SPECIAL');
          pm.expect(body.premium).to.eql(true);
      });
    language: text/javascript
order: 5000
