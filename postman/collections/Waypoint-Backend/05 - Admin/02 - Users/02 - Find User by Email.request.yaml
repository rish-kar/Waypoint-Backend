$kind: http-request
description: Finds one user by email. Clears dependent IDs first so a failed lookup cannot leave a previous user's IDs active, then stores the returned adminUserId only after an exact email match. The authenticated session userId is intentionally left untouched.
url: "{{baseUrl}}/api/v1/admin/users/by-email?email={{userEmail}}"
method: GET
headers:
  Authorization: Basic {{adminBasicAuth}}
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      const userEmail = pm.environment.get('userEmail');
      if (!adminId || !adminPassword) {
          throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      }
      if (!userEmail) {
          throw new Error('Set userEmail to the exact account you want to manage.');
      }
      pm.environment.unset('adminUserId');
      pm.environment.unset('adminSubscriptionId');
      pm.environment.unset('adminSubscriptionUserId');
      pm.environment.unset('adminGrantId');
      pm.environment.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) return;
      const body = pm.response.json();
      const expectedEmail = pm.environment.get('userEmail');
      pm.test('User email matches exactly', () => pm.expect(String(body.email).toLowerCase()).to.eql(String(expectedEmail).toLowerCase()));
      pm.test('User ID returned', () => pm.expect(body.id).to.be.a('string').and.not.empty);
      if (String(body.email).toLowerCase() === String(expectedEmail).toLowerCase()) {
          pm.environment.set('adminUserId', String(body.id).trim());
      }
      pm.test('Selected admin user ID persisted', () => pm.expect(pm.environment.get('adminUserId')).to.eql(String(body.id).trim()));
    language: text/javascript
order: 2000
