$kind: http-request
description: Grants Premium Special only to the currently selected userId. Clears any previous adminGrantId before sending so a failed grant cannot leave an old grant selected.
url: "{{baseUrl}}/api/v1/admin/users/{{userId}}/premium-special"
method: PUT
headers:
  Authorization: Basic {{adminBasicAuth}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Friends and family"
    }
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      const userId = pm.environment.get('userId');
      if (!adminId || !adminPassword) throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      if (!userId) throw new Error('Run Find User by Email first so userId is populated.');
      pm.environment.unset('adminGrantId');
      pm.environment.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) return;
      const body = pm.response.json();
      pm.test('Premium Special granted', () => {
          pm.expect(body.plan).to.eql('PREMIUM_SPECIAL');
          pm.expect(body.status).to.eql('PREMIUM_SPECIAL');
          pm.expect(body.active).to.eql(true);
      });
      pm.test('Grant belongs to selected user', () => pm.expect(body.userId).to.eql(pm.environment.get('userId')));
      if (body.userId === pm.environment.get('userId')) {
          pm.environment.set('adminGrantId', body.id);
      }
    language: text/javascript
order: 3000
