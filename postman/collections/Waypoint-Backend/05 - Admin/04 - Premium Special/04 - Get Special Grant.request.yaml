$kind: http-request
url: "{{baseUrl}}/api/v1/admin/special-grants/{{adminGrantId}}"
method: GET
headers:
  Authorization: Basic {{adminBasicAuth}}
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      const grantId = pm.environment.get('adminGrantId');
      if (!adminId || !adminPassword) throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      if (!grantId) throw new Error('Run Grant Premium Special or List Special Grants first. No grant is selected.');
      pm.environment.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) return;
      const body = pm.response.json();
      pm.test('Grant ID returned', () => pm.expect(body.id).to.eql(pm.environment.get('adminGrantId')));
      if (pm.environment.get('userId')) {
          pm.test('Grant belongs to selected user', () => pm.expect(body.userId).to.eql(pm.environment.get('userId')));
      }
    language: text/javascript
order: 5100
