$kind: http-request
description: Controlled metadata correction only; this does not replay a webhook.
url: "{{baseUrl}}/api/v1/admin/webhook-events/{{adminWebhookEventId}}"
method: PATCH
headers:
  Authorization: Basic {{adminBasicAuth}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "processingStatus": "PROCESSED",
      "clearErrorMessage": true,
      "processedAt": "2026-08-13T12:00:00Z"
    }
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      if (!adminId || !adminPassword) {
          throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      }
      pm.variables.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Webhook metadata updated', () => pm.expect(pm.response.json().processingStatus).to.eql('PROCESSED'));
    language: text/javascript
order: 6200
