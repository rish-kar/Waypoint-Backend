$kind: http-request
description: Filter by eventName, processingStatus, externalObjectId and received date range. Set includePayload=true only when raw payloads are needed.
url: "{{baseUrl}}/api/v1/admin/webhook-events?size=50&sort=receivedAt&direction=DESC&includePayload=false"
method: GET
headers:
  Authorization: Basic {{adminBasicAuth}}
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      if (!adminId || !adminPassword) {
          throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      }
      pm.variables.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Paged webhook events returned', () => pm.expect(body.items).to.be.an('array'));
      if (body.items.length > 0) {
          pm.environment.set('adminWebhookEventId', body.items[0].id);
      }
    language: text/javascript
order: 6000
