$kind: http-request
description: Lists subscriptions only for the currently selected adminUserId. Clears any previous adminSubscriptionId first and stores a new ID only from a response item that belongs to the same user.
url: "{{baseUrl}}/api/v1/admin/subscriptions?userId={{adminUserId}}&size=50&sort=updatedAt&direction=DESC"
method: GET
headers:
  Authorization: Basic {{adminBasicAuth}}
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      const adminUserId = pm.environment.get('adminUserId');
      if (!adminId || !adminPassword) throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      if (!adminUserId) throw new Error('Run Find User by Email first so adminUserId is populated.');
      pm.environment.unset('adminSubscriptionId');
      pm.environment.unset('adminSubscriptionUserId');
      pm.environment.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) return;
      const body = pm.response.json();
      const expectedUserId = pm.environment.get('adminUserId');
      pm.test('Paged subscriptions returned', () => pm.expect(body.items).to.be.an('array'));
      pm.test('Every returned subscription belongs to the selected user', () => {
          body.items.forEach(item => pm.expect(item.userId).to.eql(expectedUserId));
      });
      const selected = body.items.find(item => item.userId === expectedUserId);
      if (selected) {
          pm.environment.set('adminSubscriptionId', selected.id);
          pm.environment.set('adminSubscriptionUserId', selected.userId);
      }
    language: text/javascript
order: 3000
