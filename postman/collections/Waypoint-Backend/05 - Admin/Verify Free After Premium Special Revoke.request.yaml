$kind: http-request
url: "{{baseUrl}}/api/v1/subscriptions/current"
method: GET
headers:
  Authorization: Bearer {{jwt}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Premium Special no longer effective', () => pm.expect(body.plan).to.not.eql('PREMIUM_SPECIAL'));
    language: text/javascript
order: 7000
