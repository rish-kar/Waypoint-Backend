$kind: http-request
description: Returns the current subscription for the logged-in user. Detects a missing or expired Postman JWT before sending so stale credentials are not mistaken for a subscription failure.
url: "{{baseUrl}}/api/v1/subscriptions/current"
method: GET
headers:
  Authorization: Bearer {{jwt}}
scripts:
  - type: beforeRequest
    code: |-
      const jwt = pm.environment.get('jwt');
      if (!jwt) {
          throw new Error('No Waypoint JWT is available. Run Google Login or Microsoft Exchange Session first.');
      }
      try {
          const payloadPart = jwt.split('.')[1];
          if (!payloadPart) throw new Error('missing payload');
          const normalized = payloadPart.replace(/-/g, '+').replace(/_/g, '/');
          const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4);
          const payload = JSON.parse(atob(padded));
          if (payload.exp && payload.exp * 1000 <= Date.now()) {
              if (pm.environment.get('waypointRefreshToken')) {
                  throw new Error('Waypoint JWT has expired. Run 01 - Authentication → 02 - Microsoft Login → 03 - Refresh Token, then retry this request. The refresh request also works for a Waypoint refresh token created by Google Login.');
              }
              throw new Error('Waypoint JWT has expired and no refresh token is stored. Run Google Login or Microsoft Exchange Session again, then retry.');
          }
      } catch (error) {
          if (String(error.message).startsWith('Waypoint JWT has expired')) throw error;
          throw new Error('Stored jwt is malformed. Run Google Login or Microsoft Exchange Session again.');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) return;
      const body = pm.response.json();
      pm.test('Valid subscription plan', () => pm.expect(body.plan).to.be.oneOf(['FREE', 'PREMIUM_MONTHLY', 'PREMIUM_ANNUAL', 'PREMIUM_SPECIAL', 'ADMIN']));
      pm.test('Premium flag returned', () => pm.expect(body.premium).to.be.a('boolean'));
      pm.test('Subscription status returned', () => pm.expect(body.status).to.be.a('string'));
      pm.test('Checked at returned', () => pm.expect(body.checkedAt).to.be.a('string'));
    language: text/javascript
order: 3000
