$kind: http-request
url: "{{baseUrl}}/api/v1/entitlements"
method: GET
headers:
  Authorization: Bearer {{jwt}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Valid plan', () => pm.expect(body.plan).to.be.oneOf(['FREE', 'PREMIUM']));
      pm.test('Features returned', () => pm.expect(body.features).to.be.an('array').and.not.empty);
    language: text/javascript
order: 2000
