$kind: http-request
url: "{{baseUrl}}/api/v1/billing/status"
method: GET
headers:
  Authorization: Bearer {{jwt}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Valid plan', () => pm.expect(body.plan).to.be.oneOf(['FREE', 'PREMIUM']));
      pm.test('Exact plan code is returned', () => {
        pm.expect(body.planCode).to.be.oneOf(['FREE', 'PREMIUM_MONTHLY', 'PREMIUM_ANNUAL']);
      });
      pm.test('Plan and plan code are consistent', () => {
        if (body.plan === 'FREE') {
          pm.expect(body.planCode).to.eql('FREE');
        } else {
          pm.expect(body.planCode).to.be.oneOf(['PREMIUM_MONTHLY', 'PREMIUM_ANNUAL']);
        }
      });
      pm.test('Subscription status is returned', () => pm.expect(body.status).to.be.a('string').and.not.empty);
      if (body.status === 'ON_TRIAL') {
        pm.test('Trial end date comes from billing state', () => {
          pm.expect(body.trialEndsAt).to.be.a('string').and.not.empty;
        });
      }
      if (body.externalSubscriptionId) {
        pm.environment.set('lemonSqueezySubscriptionId', body.externalSubscriptionId);
      }
    language: text/javascript
order: 1000
