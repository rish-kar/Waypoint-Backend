$kind: http-request
url: "{{baseUrl}}/api/v1/billing/status"
method: GET
headers:
  Authorization: Bearer {{jwt}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Valid plan', () => pm.expect(pm.response.json().plan).to.be.oneOf(['FREE', 'PREMIUM']));
    language: text/javascript
order: 1000
