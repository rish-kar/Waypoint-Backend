$kind: http-request
description: LS Test 03. Cancels the selected ACTIVE paid test subscription using Lemon Squeezy's dedicated DELETE endpoint. Run LS Test 01 first if provider status is not already stored.
url: "https://api.lemonsqueezy.com/v1/subscriptions/{{lemonSqueezySubscriptionId}}"
method: DELETE
headers:
  Authorization: Bearer {{lemonSqueezyApiKey}}
  Accept: application/vnd.api+json
  Content-Type: application/vnd.api+json
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('lemonSqueezyApiKey')) {
        throw new Error('Set lemonSqueezyApiKey in the Waypoint Local environment.');
      }
      if (!pm.environment.get('lemonSqueezySubscriptionId')) {
        throw new Error('Run Billing Status first so lemonSqueezySubscriptionId is populated.');
      }
      const providerStatus = pm.environment.get('lemonSqueezyProviderStatus');
      if (providerStatus !== 'active') {
        throw new Error(`LS Test 03 requires provider status active, but current stored status is ${providerStatus || 'empty'}. Run LS Test 01 first.`);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const attributes = pm.response.json().data.attributes;
      pm.test('Subscription is test-mode data', () => pm.expect(attributes.test_mode).to.eql(true));
      pm.test('Provider marks subscription cancelled with a future grace-period end', () => {
        pm.expect(attributes.cancelled).to.eql(true);
        pm.expect(attributes.status).to.eql('cancelled');
        pm.expect(attributes.ends_at).to.be.a('string').and.not.empty;
        pm.expect(Date.parse(attributes.ends_at)).to.be.above(Date.now());
      });
      pm.environment.set('lemonSqueezyProviderStatus', attributes.status || '');
    language: text/javascript
order: 4200
