$kind: http-request
description: LS Test 04. Resumes the CANCELLED paid no-trial test subscription during its grace period by setting cancelled=false.
url: "https://api.lemonsqueezy.com/v1/subscriptions/{{lemonSqueezySubscriptionId}}"
method: PATCH
headers:
  Authorization: Bearer {{lemonSqueezyApiKey}}
  Accept: application/vnd.api+json
  Content-Type: application/vnd.api+json
body:
  type: json
  content: |-
    {
      "data": {
        "type": "subscriptions",
        "id": "{{lemonSqueezySubscriptionId}}",
        "attributes": {
          "cancelled": false
        }
      }
    }
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('lemonSqueezyApiKey')) {
        throw new Error('Set lemonSqueezyApiKey in the Waypoint Local environment.');
      }
      if (!pm.environment.get('lemonSqueezySubscriptionId')) {
        throw new Error('Run Billing Status first so lemonSqueezySubscriptionId is populated.');
      }
      if (pm.environment.get('lemonSqueezyProviderStatus') !== 'cancelled') {
        throw new Error('LS Test 04 requires provider status cancelled. Run LS Test 03 first.');
      }
      if (pm.environment.get('lemonSqueezyNoTrialPaidReady') !== 'true') {
        throw new Error('LS Test 04 requires the clean paid no-trial subscription created through LS Test 02.');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const attributes = pm.response.json().data.attributes;
      pm.test('Subscription is test-mode data', () => pm.expect(attributes.test_mode).to.eql(true));
      pm.test('Provider resumes paid no-trial subscription', () => {
        pm.expect(attributes.cancelled).to.eql(false);
        pm.expect(attributes.status).to.eql('active');
        pm.expect(attributes.ends_at).to.eql(null);
        pm.expect(attributes.trial_ends_at).to.eql(null);
      });
      pm.environment.set('lemonSqueezyProviderStatus', attributes.status || '');
    language: text/javascript
order: 4300
