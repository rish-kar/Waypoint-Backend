$kind: http-request
description: Requires valid Lemon Squeezy test-mode configuration. The hosted checkout is locked to the configured annual variant.
url: "{{baseUrl}}/api/v1/billing/checkout"
method: POST
headers:
  Authorization: Bearer {{jwt}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "plan": "ANNUAL"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Checkout URL returned', () => pm.expect(body.checkoutUrl).to.match(/^https:\/\//));
    language: text/javascript
order: 3000
