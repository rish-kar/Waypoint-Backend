$kind: http-request
description: Step 6 helper. Lists invoices for the selected Lemon Squeezy subscription and stores the newest paid, non-refunded invoice ID in lemonSqueezyInvoiceId.
url: "https://api.lemonsqueezy.com/v1/subscription-invoices?filter[subscription_id]={{lemonSqueezySubscriptionId}}"
method: GET
headers:
  Authorization: Bearer {{lemonSqueezyApiKey}}
  Accept: application/vnd.api+json
  Content-Type: application/vnd.api+json
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('lemonSqueezyApiKey')) {
        throw new Error('Set lemonSqueezyApiKey in the Waypoint Local environment.');
      }
      if (!pm.environment.get('lemonSqueezySubscriptionId')) {
        throw new Error('Run Billing Status first so lemonSqueezySubscriptionId is populated.');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Invoice list returned', () => pm.expect(body.data).to.be.an('array'));
      const paidInvoice = body.data.find(invoice => invoice.attributes?.status === 'paid' && invoice.attributes?.refunded !== true);
      if (paidInvoice) {
        pm.environment.set('lemonSqueezyInvoiceId', paidInvoice.id);
      } else {
        pm.environment.unset('lemonSqueezyInvoiceId');
      }
      pm.test('A paid non-refunded invoice is available for refund testing', () => {
        pm.expect(paidInvoice, 'No paid non-refunded invoice found yet').to.exist;
      });
    language: text/javascript
order: 4600
