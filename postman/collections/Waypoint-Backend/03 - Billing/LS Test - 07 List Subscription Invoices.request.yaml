$kind: http-request
description: LS Test 07. Lists invoices for the selected test subscription and stores the newest paid, non-refunded, positive-value invoice ID for refund testing.
url: "https://api.lemonsqueezy.com/v1/subscription-invoices?filter[subscription_id]={{lemonSqueezySubscriptionId}}"
method: GET
headers:
  Authorization: Bearer {{lemonSqueezyApiKey}}
  Accept: application/vnd.api+json
  Content-Type: application/vnd.api+json
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('lemonSqueezyApiKey')) {
        throw new Error('Set lemonSqueezyApiKey in the Waypoint Local environment.');
      }
      if (!pm.environment.get('lemonSqueezySubscriptionId')) {
        throw new Error('Run Billing Status first so lemonSqueezySubscriptionId is populated.');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Invoice list returned', () => pm.expect(body.data).to.be.an('array'));
      const subscriptionId = pm.environment.get('lemonSqueezySubscriptionId');
      const refundableInvoice = body.data.find(invoice => {
        const attributes = invoice.attributes || {};
        return String(attributes.subscription_id) === String(subscriptionId)
          && attributes.test_mode === true
          && attributes.status === 'paid'
          && attributes.refunded !== true
          && Number(attributes.total) > 0;
      });
      if (refundableInvoice) {
        pm.environment.set('lemonSqueezyInvoiceId', refundableInvoice.id);
      } else {
        pm.environment.unset('lemonSqueezyInvoiceId');
      }
      pm.test('A positive-value paid non-refunded test invoice is available', () => {
        pm.expect(refundableInvoice, 'No positive-value paid non-refunded test invoice found').to.exist;
      });
    language: text/javascript
order: 4600
