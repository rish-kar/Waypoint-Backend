$kind: http-request
description: Verifies that the invalid-signature smoke payload never reached webhook persistence.
url: "{{baseUrl}}/api/v1/admin/webhook-events?externalObjectId=postman-invalid-signature-subscription-001&size=10&sort=receivedAt&direction=DESC&includePayload=false"
method: GET
headers:
  Authorization: Basic {{adminBasicAuth}}
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      if (!adminId || !adminPassword) {
          throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      }
      pm.variables.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Rejected signature was not persisted', () => {
        pm.expect(body.totalElements).to.eql(0);
        pm.expect(body.items).to.be.an('array').and.empty;
      });
    language: text/javascript
order: 1100
