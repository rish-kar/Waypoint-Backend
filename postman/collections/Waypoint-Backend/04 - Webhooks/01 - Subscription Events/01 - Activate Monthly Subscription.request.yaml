$kind: http-request
description: Creates or updates an ACTIVE subscription for the logged-in user.
url: "{{baseUrl}}/api/v1/webhooks/lemonsqueezy"
method: POST
headers:
  Content-Type: application/json
  X-Signature: "{{webhookSignature}}"
body:
  type: json
  content: "{{webhookBody}}"
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const secret = pm.environment.get('webhookSecret');
      if (!secret) {
          throw new Error('Set webhookSecret in the environment.');
      }
      const payload = JSON.stringify({
        meta: {
          event_name: 'subscription_created',
          custom_data: { waypoint_user_id: pm.environment.get('userId'), waypoint_plan: 'MONTHLY' }
        },
        data: {
          type: 'subscriptions',
          id: pm.environment.get('subscriptionId'),
          attributes: {
            customer_id: 'postman-customer',
            product_id: 'postman-product',
            variant_id: pm.environment.get('monthlyVariantId'),
            status: 'active',
            renews_at: '2030-01-01T00:00:00Z',
            ends_at: null
          }
        }
      });
      pm.variables.set('webhookBody', payload);
      pm.variables.set('webhookSignature', CryptoJS.HmacSHA256(payload, secret).toString(CryptoJS.enc.Hex));
    language: text/javascript
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
