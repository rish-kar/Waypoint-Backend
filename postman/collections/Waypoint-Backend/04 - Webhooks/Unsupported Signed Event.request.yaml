$kind: http-request
description: Sends a correctly signed but unsupported Lemon Squeezy event. Waypoint must acknowledge it without changing subscription state and store it as IGNORED.
url: "{{baseUrl}}/api/v1/webhooks/lemonsqueezy"
method: POST
headers:
  Content-Type: application/json
  X-Signature: "{{webhookSignature}}"
body:
  type: json
  content: "{{webhookBody}}"
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const secret = pm.environment.get('webhookSecret');
      if (!secret) {
          throw new Error('Set webhookSecret to the LEMON_SQUEEZY_WEBHOOK_SECRET used by the backend.');
      }
      const payload = JSON.stringify({
        meta: { event_name: 'order_created' },
        data: {
          type: 'orders',
          id: 'postman-order-unsupported-001',
          attributes: { status: 'paid' }
        }
      });
      pm.variables.set('webhookBody', payload);
      pm.variables.set('webhookSignature', CryptoJS.HmacSHA256(payload, secret).toString(CryptoJS.enc.Hex));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.environment.set('unsupportedWebhookReady', 'true');
      }
    language: text/javascript
order: 5000
