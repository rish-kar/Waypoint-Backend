$kind: http-request
description: Verifies that the correctly signed unsupported event was persisted as IGNORED rather than PROCESSED or FAILED.
url: "{{baseUrl}}/api/v1/admin/webhook-events?eventName=order_created&processingStatus=IGNORED&externalObjectId=postman-order-unsupported-001&size=10&sort=receivedAt&direction=DESC&includePayload=false"
method: GET
headers:
  Authorization: Basic {{adminBasicAuth}}
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      if (!adminId || !adminPassword) {
          throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      }
      pm.variables.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const event = (body.items || []).find(item =>
        item.eventName === 'order_created'
        && item.processingStatus === 'IGNORED'
        && item.externalObjectId === 'postman-order-unsupported-001'
      );
      pm.test('Unsupported event is IGNORED', () => {
        pm.expect(event, 'No matching IGNORED webhook row found').to.exist;
        pm.expect(event.errorMessage).to.eql(null);
        pm.expect(event.processedAt).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 5100
