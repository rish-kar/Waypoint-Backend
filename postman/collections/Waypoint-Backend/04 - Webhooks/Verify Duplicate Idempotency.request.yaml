$kind: http-request
description: Verifies that two identical deliveries produced one persisted event row because the webhook payload hash is idempotent.
url: "{{baseUrl}}/api/v1/admin/webhook-events?eventName=subscription_updated&externalObjectId=postman-idempotency-subscription-001&size=10&sort=receivedAt&direction=DESC&includePayload=false"
method: GET
headers:
  Authorization: Basic {{adminBasicAuth}}
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      if (!adminId || !adminPassword) {
          throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      }
      if (pm.environment.get('webhookDuplicateReady') !== 'true') {
          throw new Error('Run Duplicate Idempotency first.');
      }
      pm.variables.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Only one idempotent event row exists', () => {
        pm.expect(body.totalElements).to.eql(1);
        pm.expect(body.items).to.have.length(1);
        pm.expect(body.items[0].processingStatus).to.eql('PROCESSED');
        pm.expect(body.items[0].externalObjectId).to.eql('postman-idempotency-subscription-001');
      });
    language: text/javascript
order: 5300
