$kind: http-request
description: Marks the same subscription as REFUNDED.
url: "{{baseUrl}}/api/v1/webhooks/lemonsqueezy"
method: POST
headers:
  Content-Type: application/json
  X-Signature: "{{webhookSignature}}"
body:
  type: json
  content: "{{webhookBody}}"
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const secret = pm.environment.get('webhookSecret');
      if (!secret) {
          throw new Error('Set webhookSecret in the environment.');
      }
      const subscriptionId = pm.environment.get('subscriptionId');
      const payload = JSON.stringify({
        meta: {
          event_name: 'subscription_payment_refunded',
          custom_data: { waypoint_user_id: pm.environment.get('userId'), waypoint_plan: 'MONTHLY' }
        },
        data: {
          type: 'subscription-invoices',
          id: `subinv_${subscriptionId}`,
          attributes: {
            subscription_id: subscriptionId,
            customer_id: 'postman-customer',
            status: 'refunded'
          }
        }
      });
      pm.variables.set('webhookBody', payload);
      pm.variables.set('webhookSignature', CryptoJS.HmacSHA256(payload, secret).toString(CryptoJS.enc.Hex));
    language: text/javascript
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
