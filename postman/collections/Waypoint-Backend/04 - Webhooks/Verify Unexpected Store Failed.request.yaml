$kind: http-request
description: Verifies that the wrong-store webhook was retained as FAILED with an error instead of being silently discarded.
url: "{{baseUrl}}/api/v1/admin/webhook-events?eventName=subscription_updated&processingStatus=FAILED&externalObjectId=postman-wrong-store-subscription-001&size=10&sort=receivedAt&direction=DESC&includePayload=false"
method: GET
headers:
  Authorization: Basic {{adminBasicAuth}}
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const adminId = pm.environment.get('adminId');
      const adminPassword = pm.environment.get('adminPassword');
      if (!adminId || !adminPassword) {
          throw new Error('Set adminId and adminPassword in the Waypoint Local environment.');
      }
      pm.environment.set('adminBasicAuth', CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(`${adminId}:${adminPassword}`)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const event = (body.items || [])[0];
      pm.test('Unexpected-store event is FAILED', () => {
        pm.expect(event, 'No matching FAILED webhook row found').to.exist;
        pm.expect(event.processingStatus).to.eql('FAILED');
        pm.expect(event.externalObjectId).to.eql('postman-wrong-store-subscription-001');
        pm.expect(event.errorMessage).to.be.a('string').and.not.empty;
        pm.expect(event.processedAt).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 5500
