$kind: http-request
description: Delivers the exact same valid webhook twice. Both deliveries must return 200 while Waypoint keeps only one event row for the payload hash.
url: "{{baseUrl}}/api/v1/webhooks/lemonsqueezy"
method: POST
headers:
  Content-Type: application/json
  X-Signature: "{{webhookSignature}}"
body:
  type: json
  content: "{{webhookBody}}"
scripts:
  - type: beforeRequest
    code: |-
      let CryptoJS;
      try {
          CryptoJS = pm.require('npm:crypto-js@4.2.0');
      } catch (error) {
          CryptoJS = require('crypto-js');
      }
      const secret = pm.environment.get('webhookSecret');
      const userId = pm.environment.get('userId');
      const variantId = pm.environment.get('monthlyVariantId');
      if (!secret) {
          throw new Error('Set webhookSecret to the LEMON_SQUEEZY_WEBHOOK_SECRET used by the backend.');
      }
      if (!userId || !variantId) {
          throw new Error('Run Google Login and set monthlyVariantId before this test.');
      }
      pm.environment.unset('webhookDuplicateReady');
      const payload = JSON.stringify({
        meta: {
          event_name: 'subscription_updated',
          custom_data: { waypoint_user_id: userId, waypoint_plan: 'MONTHLY' }
        },
        data: {
          type: 'subscriptions',
          id: 'postman-idempotency-subscription-001',
          attributes: {
            customer_id: 'postman-idempotency-customer',
            product_id: 'postman-product',
            variant_id: variantId,
            status: 'active',
            renews_at: '2030-01-01T00:00:00Z',
            ends_at: null
          }
        }
      });
      pm.variables.set('webhookBody', payload);
      pm.variables.set('webhookSignature', CryptoJS.HmacSHA256(payload, secret).toString(CryptoJS.enc.Hex));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('First delivery returns 200', () => pm.response.to.have.status(200));
      const baseUrl = pm.environment.get('baseUrl');
      const payload = pm.variables.get('webhookBody');
      const signature = pm.variables.get('webhookSignature');
      pm.sendRequest({
        url: `${baseUrl}/api/v1/webhooks/lemonsqueezy`,
        method: 'POST',
        header: {
          'Content-Type': 'application/json',
          'X-Signature': signature
        },
        body: { mode: 'raw', raw: payload }
      }, (error, response) => {
        pm.test('Duplicate delivery returns 200', () => {
          pm.expect(error).to.eql(null);
          pm.expect(response.code).to.eql(200);
        });
        if (!error && response.code === 200) {
          pm.environment.set('webhookDuplicateReady', 'true');
        }
      });
    language: text/javascript
order: 5200
