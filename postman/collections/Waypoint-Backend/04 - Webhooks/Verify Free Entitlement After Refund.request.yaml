$kind: http-request
url: "{{baseUrl}}/api/v1/entitlements"
method: GET
headers:
  Authorization: Bearer {{jwt}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Premium is disabled', () => pm.expect(body.premium).to.eql(false));
      pm.test('Plan is FREE', () => pm.expect(body.plan).to.eql('FREE'));
    language: text/javascript
order: 5000
