$kind: http-request
description: Confirms that a malformed/non-matching webhook signature is rejected before the event is persisted.
url: "{{baseUrl}}/api/v1/webhooks/lemonsqueezy"
method: POST
headers:
  Content-Type: application/json
  X-Signature: bad-signature
body:
  type: json
  content: "{{webhookBody}}"
scripts:
  - type: beforeRequest
    code: |-
      const payload = JSON.stringify({
        meta: {
          event_name: 'subscription_created',
          custom_data: { waypoint_user_id: pm.environment.get('userId'), waypoint_plan: 'MONTHLY' }
        },
        data: {
          type: 'subscriptions',
          id: 'postman-invalid-signature-subscription-001',
          attributes: {
            customer_id: 'postman-customer',
            product_id: 'postman-product',
            variant_id: pm.environment.get('monthlyVariantId'),
            status: 'active',
            renews_at: '2030-01-01T00:00:00Z',
            ends_at: null
          }
        }
      });
      pm.variables.set('webhookBody', payload);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 401', () => pm.response.to.have.status(401));
      const body = pm.response.json();
      pm.test('Invalid signature is rejected', () => {
        pm.expect(body.code).to.eql('UNAUTHORIZED');
        pm.expect(body.message).to.eql('Invalid webhook signature');
      });
    language: text/javascript
order: 1000
