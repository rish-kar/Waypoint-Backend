$kind: collection
id: aa93dc55-52d9-4b40-84f0-0d397a7301a8
name: Waypoint Backend API
description: Run folders in order. Health checks need only the backend and PostgreSQL. Authentication requests cover Google login, Microsoft OAuth with PKCE, Waypoint session exchange/refresh, replay protection and bearer-token enforcement. Successful provider login stores the shared Waypoint jwt and userId. Microsoft consent uses the real Chrome extension web-auth redirect. Checkout requests require Lemon Squeezy test-mode credentials. Webhook requests generate X-Signature automatically from webhookSecret.
scripts:
  - type: http:beforeRequest
    code: |-
      if (!pm.environment.get('baseUrl')) {
          throw new Error('Select the Waypoint Local environment.');
      }
    language: text/javascript
