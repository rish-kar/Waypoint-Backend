$kind: collection
id: aa93dc55-52d9-4b40-84f0-0d397a7301a8
name: Waypoint Backend API
description: Functional Waypoint backend flows only. Run folders in order. Negative authorization, malformed-token and hardening probes are covered by automated tests instead of manual Postman requests.
scripts:
  - type: http:beforeRequest
    code: |-
      if (!pm.environment.get('baseUrl')) {
          throw new Error('Select the Waypoint Local environment.');
      }

      const requestUrl = pm.request.url.toString();
      const adminTotp = pm.environment.get('adminTotp');
      if (adminTotp && requestUrl.includes('/api/v1/admin/')) {
          pm.request.headers.upsert({ key: 'X-Admin-TOTP', value: adminTotp });
      } else {
          pm.request.headers.remove('X-Admin-TOTP');
      }

      // Collection pre-request scripts run before request-level pre-request scripts.
      // Validate only the URL here. Request-level scripts may intentionally generate
      // dynamic header/body variables such as webhookSignature and webhookBody later.
      const resolvedUrl = pm.variables.replaceIn(requestUrl);
      const unresolvedUrl = resolvedUrl.match(/{{[^}]+}}/g) || [];
      if (unresolvedUrl.length) {
          throw new Error(`Unresolved Postman URL variables: ${unresolvedUrl.join(', ')}`);
      }
    language: text/javascript
