$kind: http-request
description: Starts the real Microsoft authorization-code + PKCE flow. Set microsoftRedirectUri to the exact Chrome identity redirect URI allowlisted by the backend. Open the returned authorizationUrl through chrome.identity.launchWebAuthFlow (or the extension UI), then copy exchange_code from the final extension redirect into microsoftExchangeCode.
url: "{{baseUrl}}/api/v1/auth/microsoft/start"
method: POST
headers:
  Content-Type: application/json
  X-Request-ID: postman-ms-start
body:
  type: json
  content: |-
    {
      "redirectUri": "{{microsoftRedirectUri}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Authorization URL returned', () => pm.expect(body.authorizationUrl).to.be.a('string').and.not.empty);
      pm.test('PKCE is enabled', () => pm.expect(body.authorizationUrl).to.include('code_challenge='));
      pm.test('Transaction expires', () => pm.expect(body.expiresIn).to.be.above(0));
      pm.environment.set('microsoftAuthorizationUrl', body.authorizationUrl);
      console.log('Open through the Chrome extension web-auth flow:', body.authorizationUrl);
    language: text/javascript
order: 5200
