$kind: http-request
description: Rotates the opaque Waypoint refresh token without requiring a valid access JWT. Run after Microsoft Session Exchange or another login that returned waypointRefreshToken.
url: "{{baseUrl}}/api/v1/auth/session/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{waypointRefreshToken}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const current = pm.environment.get('waypointRefreshToken');
      if (!current) throw new Error('Run Microsoft Session Exchange first so waypointRefreshToken is populated.');
      pm.environment.set('previousWaypointRefreshToken', current);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const previous = pm.environment.get('previousWaypointRefreshToken');
      pm.test('Refresh token rotated', () => pm.expect(body.refreshToken).to.not.eql(previous));
      pm.test('New access token returned', () => pm.expect(body.accessToken).to.be.a('string').and.not.empty);
      pm.environment.set('jwt', body.accessToken);
      pm.environment.set('waypointRefreshToken', body.refreshToken);
    language: text/javascript
order: 5500
