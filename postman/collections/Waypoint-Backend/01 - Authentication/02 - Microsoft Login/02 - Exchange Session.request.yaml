$kind: http-request
description: Exchanges the short-lived one-time Microsoft exchange code for Waypoint tokens. Clears stale auth state before the attempt and saves fresh state only after success.
url: "{{baseUrl}}/api/v1/auth/session/exchange"
method: POST
headers:
  Content-Type: application/json
  X-Request-ID: postman-ms-exchange
body:
  type: json
  content: |-
    {
      "exchangeCode": "{{microsoftExchangeCode}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('microsoftExchangeCode')) {
          throw new Error('Set microsoftExchangeCode from the Microsoft callback first.');
      }
      pm.environment.unset('jwt');
      pm.environment.unset('userId');
      pm.environment.unset('waypointRefreshToken');
      pm.environment.unset('previousWaypointRefreshToken');
      pm.environment.unset('adminSubscriptionId');
      pm.environment.unset('adminSubscriptionUserId');
      pm.environment.unset('adminGrantId');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) return;
      const body = pm.response.json();
      pm.test('Waypoint access token returned', () => pm.expect(body.accessToken).to.be.a('string').and.not.empty);
      pm.test('Waypoint refresh token returned', () => pm.expect(body.refreshToken).to.be.a('string').and.not.empty);
      pm.test('Bearer token returned', () => pm.expect(body.tokenType).to.eql('Bearer'));
      pm.test('User identity returned', () => {
          pm.expect(body.user?.id).to.be.a('string').and.not.empty;
          pm.expect(body.user?.email).to.be.a('string').and.not.empty;
      });
      pm.environment.set('jwt', body.accessToken);
      pm.environment.set('waypointRefreshToken', body.refreshToken);
      pm.environment.set('userId', body.user.id);
      pm.environment.set('userEmail', body.user.email);
    language: text/javascript
order: 5300
