$kind: http-request
description: Exchanges the short-lived one-time exchange code produced after the Microsoft callback for Waypoint access and refresh tokens. Paste exchange_code from the extension redirect into microsoftExchangeCode first.
url: "{{baseUrl}}/api/v1/auth/session/exchange"
method: POST
headers:
  Content-Type: application/json
  X-Request-ID: postman-ms-exchange
body:
  type: json
  content: |-
    {
      "exchangeCode": "{{microsoftExchangeCode}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Waypoint access token returned', () => pm.expect(body.accessToken).to.be.a('string').and.not.empty);
      pm.test('Waypoint refresh token returned', () => pm.expect(body.refreshToken).to.be.a('string').and.not.empty);
      pm.test('Bearer token returned', () => pm.expect(body.tokenType).to.eql('Bearer'));
      pm.environment.set('jwt', body.accessToken);
      pm.environment.set('waypointRefreshToken', body.refreshToken);
      pm.environment.set('userId', body.user.id);
      pm.environment.set('userEmail', body.user.email);
    language: text/javascript
order: 5300
