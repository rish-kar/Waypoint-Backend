$kind: http-request
description: One-time Google OAuth bootstrap. Set googleClientId and googleClientSecret in Waypoint Local and ensure googleOAuthRedirectUri is allowlisted on the same Google OAuth client. Run this request, then open googleAuthorizationUrl in a browser and complete consent. Copy the returned code query parameter into googleAuthorizationCode.
url: "{{googleAuthorizationUrl}}"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      const clientId = String(pm.environment.get('googleClientId') || '').trim();
      const redirectUri = String(pm.environment.get('googleOAuthRedirectUri') || '').trim();
      if (!clientId) {
          throw new Error('Set googleClientId in the Waypoint Local environment.');
      }
      if (!String(pm.environment.get('googleClientSecret') || '').trim()) {
          throw new Error('Set googleClientSecret in the Waypoint Local environment.');
      }
      if (!redirectUri) {
          throw new Error('Set googleOAuthRedirectUri in the Waypoint Local environment.');
      }
      const query = [
          ['client_id', clientId],
          ['redirect_uri', redirectUri],
          ['response_type', 'code'],
          ['scope', 'openid email profile'],
          ['access_type', 'offline'],
          ['prompt', 'consent'],
          ['include_granted_scopes', 'true']
      ].map(([key, value]) => `${encodeURIComponent(key)}=${encodeURIComponent(value)}`).join('&');
      const authorizationUrl = `https://accounts.google.com/o/oauth2/v2/auth?${query}`;
      pm.environment.set('googleAuthorizationUrl', authorizationUrl);
      console.log('Open this URL in your browser and complete Google consent:', authorizationUrl);
    language: text/javascript
order: 1000
