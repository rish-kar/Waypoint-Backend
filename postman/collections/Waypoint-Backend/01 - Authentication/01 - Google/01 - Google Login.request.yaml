$kind: http-request
description: Uses googleAccessToken to authenticate the user with Waypoint. After the one-time Google OAuth bootstrap, this request automatically refreshes an expired or missing Google access token from googleRefreshToken, then saves the fresh Waypoint access token, refresh token, userId and userEmail only after a successful login.
url: "{{baseUrl}}/api/v1/auth/google"
method: POST
headers:
  Content-Type: application/json
  X-Request-ID: postman-auth-login
body:
  type: json
  content: |-
    {
      "accessToken": "{{googleAccessToken}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const currentAccessToken = String(pm.environment.get('googleAccessToken') || '').trim();
      const expiresAt = Number(pm.environment.get('googleAccessTokenExpiresAt') || 0);
      const hasKnownExpiry = Number.isFinite(expiresAt) && expiresAt > 0;
      const accessTokenUsable = currentAccessToken && (!hasKnownExpiry || expiresAt > Date.now() + 60000);

      if (!accessTokenUsable) {
          const clientId = String(pm.environment.get('googleClientId') || '').trim();
          const clientSecret = String(pm.environment.get('googleClientSecret') || '').trim();
          const refreshToken = String(pm.environment.get('googleRefreshToken') || '').trim();
          if (!clientId || !clientSecret || !refreshToken) {
              throw new Error('Google access token is unavailable or expired. Run Google OAuth - 1 Prepare Authorization URL and Google OAuth - 2 Exchange Authorization Code once, then retry Google Login.');
          }

          const form = [
              ['client_id', clientId],
              ['client_secret', clientSecret],
              ['refresh_token', refreshToken],
              ['grant_type', 'refresh_token']
          ].map(([key, value]) => `${encodeURIComponent(key)}=${encodeURIComponent(value)}`).join('&');

          const response = await pm.sendRequest({
              url: 'https://oauth2.googleapis.com/token',
              method: 'POST',
              header: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: { mode: 'raw', raw: form }
          });
          if (response.code !== 200) {
              throw new Error(`Google access-token refresh failed with HTTP ${response.code}. Run the OAuth bootstrap again if the refresh token was revoked.`);
          }
          const refreshed = response.json();
          if (!refreshed.access_token || !Number(refreshed.expires_in)) {
              throw new Error('Google token refresh returned an incomplete response.');
          }
          pm.environment.set('googleAccessToken', refreshed.access_token);
          pm.environment.set('googleAccessTokenExpiresAt', String(Date.now() + Number(refreshed.expires_in) * 1000));
      }

      pm.environment.unset('jwt');
      pm.environment.unset('userId');
      pm.environment.unset('waypointRefreshToken');
      pm.environment.unset('previousWaypointRefreshToken');
      pm.environment.unset('adminSubscriptionId');
      pm.environment.unset('adminSubscriptionUserId');
      pm.environment.unset('adminGrantId');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) return;
      const body = pm.response.json();
      pm.test('Waypoint session returned', () => {
          pm.expect(body.tokenType).to.eql('Bearer');
          pm.expect(body.accessToken).to.be.a('string').and.not.empty;
          pm.expect(body.expiresIn).to.be.above(0);
          pm.expect(body.refreshToken).to.be.a('string').and.not.empty;
          pm.expect(body.refreshExpiresIn).to.be.above(0);
          pm.expect(body.user?.id).to.be.a('string').and.not.empty;
          pm.expect(body.user?.email).to.be.a('string').and.not.empty;
      });
      pm.test('Request ID propagated', () => pm.expect(pm.response.headers.get('X-Request-ID')).to.eql('postman-auth-login'));
      pm.environment.set('jwt', body.accessToken);
      pm.environment.set('waypointRefreshToken', body.refreshToken);
      pm.environment.set('userId', body.user.id);
      pm.environment.set('userEmail', body.user.email);
    language: text/javascript
order: 5000
