$kind: http-request
description: Completes the backend-controlled Google login after browser consent. Exchanges the one-time Waypoint handle for the normal Waypoint JWT and rotating refresh token. Google client credentials and Google provider tokens never enter Postman.
url: "{{baseUrl}}/api/v1/auth/session/exchange"
method: POST
headers:
  Content-Type: application/json
  X-Request-ID: postman-google-exchange
body:
  type: json
  content: |-
    {
      "exchangeCode": "{{googleExchangeCode}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      if (!String(pm.environment.get('googleExchangeCode') || '').trim()) {
          throw new Error('Run 01 - Start Login, complete Google sign-in in the browser, then retry Complete Login.');
      }
      pm.environment.unset('jwt');
      pm.environment.unset('userId');
      pm.environment.unset('waypointRefreshToken');
      pm.environment.unset('previousWaypointRefreshToken');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
          const body = pm.response.json();
          pm.test('Waypoint session returned', () => {
              pm.expect(body.tokenType).to.eql('Bearer');
              pm.expect(body.accessToken).to.be.a('string').and.not.empty;
              pm.expect(body.expiresIn).to.be.above(0);
              pm.expect(body.refreshToken).to.be.a('string').and.not.empty;
              pm.expect(body.refreshExpiresIn).to.be.above(0);
              pm.expect(body.user?.id).to.be.a('string').and.not.empty;
              pm.expect(body.user?.email).to.be.a('string').and.not.empty;
          });
          pm.environment.set('jwt', body.accessToken);
          pm.environment.set('waypointRefreshToken', body.refreshToken);
          pm.environment.set('userId', body.user.id);
          pm.environment.set('userEmail', body.user.email);
          pm.environment.unset('googleExchangeCode');
          pm.environment.unset('googleAuthorizationUrl');
      }
    language: text/javascript
order: 5100
