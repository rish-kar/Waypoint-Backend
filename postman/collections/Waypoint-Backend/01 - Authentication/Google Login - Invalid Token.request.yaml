$kind: http-request
description: Requires network access from the backend to Google.
url: "{{baseUrl}}/api/v1/auth/google"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "accessToken": "invalid-google-access-token"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 401', () => pm.response.to.have.status(401));
      const body = pm.response.json();
      pm.test('Generic authentication failure returned', () => {
          pm.expect(body.code).to.eql('UNAUTHORIZED');
          pm.expect(body.message).to.eql('Google authentication failed');
      });
    language: text/javascript
order: 4000
