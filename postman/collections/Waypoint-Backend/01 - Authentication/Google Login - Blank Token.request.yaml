$kind: http-request
url: "{{baseUrl}}/api/v1/auth/google"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "accessToken": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400', () => pm.response.to.have.status(400));
      pm.test('Invalid request code returned', () => pm.expect(pm.response.json().code).to.eql('INVALID_REQUEST'));
    language: text/javascript
order: 2000
