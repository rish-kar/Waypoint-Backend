$kind: http-request
url: "{{baseUrl}}/api/v1/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 401', () => pm.response.to.have.status(401));
      pm.test('Authentication required', () => pm.expect(pm.response.json().message).to.eql('Authentication required'));
    language: text/javascript
order: 6000
