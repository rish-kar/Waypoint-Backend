$kind: http-request
description: Verifies the current Waypoint bearer session. Works after either Google Login or Microsoft Session Exchange.
url: "{{baseUrl}}/api/v1/auth/session"
method: GET
headers:
  Authorization: "Bearer {{jwt}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Session is signed in', () => pm.expect(body.signedIn).to.eql(true));
      pm.test('Session user matches environment', () => pm.expect(body.user.id).to.eql(pm.environment.get('userId')));
    language: text/javascript
order: 5400
