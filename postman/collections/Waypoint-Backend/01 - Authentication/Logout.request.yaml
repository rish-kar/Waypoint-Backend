$kind: http-request
description: Revokes the current Waypoint JWT and all Waypoint refresh sessions while preserving any linked Microsoft identity. To verify link persistence, sign in with the same Microsoft account again after logout and confirm the same userId is returned.
url: "{{baseUrl}}/api/v1/auth/logout"
method: POST
headers:
  Authorization: "Bearer {{jwt}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 5900
