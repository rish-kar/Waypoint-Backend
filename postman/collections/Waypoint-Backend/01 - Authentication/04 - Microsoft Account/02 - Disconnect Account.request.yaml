$kind: http-request
description: Explicitly removes the Microsoft provider credential/link for the authenticated Waypoint user. This is intentionally separate from logout.
url: "{{baseUrl}}/api/v1/auth/microsoft"
method: DELETE
headers:
  Authorization: "Bearer {{jwt}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 5800
