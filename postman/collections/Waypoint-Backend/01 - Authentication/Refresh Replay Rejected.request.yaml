$kind: http-request
description: Confirms one-time Waypoint refresh-token rotation by replaying the previous refresh token after Refresh Waypoint Session.
url: "{{baseUrl}}/api/v1/auth/session/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{previousWaypointRefreshToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 401', () => pm.response.to.have.status(401));
      pm.test('Replay is rejected generically', () => pm.expect(pm.response.json().code).to.eql('UNAUTHORIZED'));
    language: text/javascript
order: 5600
