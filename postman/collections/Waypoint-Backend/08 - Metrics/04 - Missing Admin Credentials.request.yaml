$kind: http-request
url: "{{baseUrl}}/actuator/prometheus"
method: GET
description: Verifies that the protected Prometheus endpoint rejects requests without admin Basic Auth credentials.
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
