$kind: http-request
url: "{{baseUrl}}/api/v1/ai/chat"
method: POST
headers:
  Content-Type: application/json
  X-Request-ID: postman-ai-chat
body:
  type: json
  content: |-
    {
      "question": "What is Waypoint?",
      "pageTitle": "Waypoint",
      "pageDescription": "Browser productivity extension",
      "pageText": "Waypoint is a Chrome extension that helps users organize tabs and interact with browser workflows.",
      "history": [],
      "allowGeneral": false,
      "model": "openai-gpt-5-nano"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('GPT-5 nano returns an answer', () => {
          pm.expect(body.answer).to.be.a('string').and.not.empty;
          pm.expect(body.modelId).to.eql('openai-gpt-5-nano');
      });
      pm.test('Answer is grounded in page context', () => pm.expect(body.source).to.eql('page'));
      pm.test('Request ID propagated', () => pm.expect(pm.response.headers.get('X-Request-ID')).to.eql('postman-ai-chat'));
    language: text/javascript
description: "Tests GPT-5 nano page-context chat through the Waypoint backend. Requires AI_OPENAI_ENABLED=true and OPENAI_API_KEY."
order: 8300
