$kind: http-request
url: "{{baseUrl}}/api/v1/ai/intent"
method: POST
headers:
  Authorization: "Bearer {{jwt}}"
  Content-Type: application/json
  X-Request-ID: postman-ai-intent
body:
  type: json
  content: |-
    {
      "request": "Group my GitHub tabs",
      "lastSelectionAvailable": false,
      "lastSelectionTarget": "",
      "currentTime": "{{currentTime}}",
      "timeZone": "Asia/Kolkata",
      "locale": "en-IN",
      "model": "openai-gpt-5-nano"
    }
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('jwt')) throw new Error('Run login first so jwt is populated.');
      pm.variables.set('currentTime', new Date().toISOString());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) return;
      const body = pm.response.json();
      pm.test('GPT-5 nano routes a browser action', () => {
          pm.expect(body.kind).to.eql('browser-action');
          pm.expect(body.action).to.eql('group-tabs');
          pm.expect(body.scope).to.eql('matching-tabs');
          pm.expect(body.modelId).to.eql('openai-gpt-5-nano');
      });
      pm.test('GitHub target is preserved for deterministic matching', () => {
          pm.expect(body.target).to.be.a('string').and.not.empty;
          pm.expect(body.matchTerms).to.be.an('array').and.not.empty;
      });
      pm.test('Request ID propagated', () => pm.expect(pm.response.headers.get('X-Request-ID')).to.eql('postman-ai-intent'));
    language: text/javascript
description: "Calls the authenticated Waypoint backend, which sends the intent to OpenAI GPT-5 nano and validates the structured response before returning it. Uses the runtime request time instead of a hardcoded timestamp."
order: 8200
