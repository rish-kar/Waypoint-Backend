services:
  postgres:
    image: postgres:16
    container_name: waypoint-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint}
    ports:
      - "5432:5432"
    volumes:
      - waypoint-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waypoint} -d ${POSTGRES_DB:-waypoint}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
    container_name: waypoint-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-waypoint}
      DATABASE_USERNAME: ${POSTGRES_USER:-waypoint}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-waypoint}
      JWT_SECRET: ${JWT_SECRET:-waypoint-local-development-secret-change-before-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      LEMON_SQUEEZY_API_KEY: ${LEMON_SQUEEZY_API_KEY:-local-lemon-squeezy-api-key}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID:-local-store-id}
      LEMON_SQUEEZY_MONTHLY_VARIANT_ID: ${LEMON_SQUEEZY_MONTHLY_VARIANT_ID:-local-monthly-variant-id}
      LEMON_SQUEEZY_ANNUAL_VARIANT_ID: ${LEMON_SQUEEZY_ANNUAL_VARIANT_ID:-local-annual-variant-id}
      LEMON_SQUEEZY_WEBHOOK_SECRET: ${LEMON_SQUEEZY_WEBHOOK_SECRET:-local-webhook-secret}
      AI_SELF_HOSTED_ENABLED: ${AI_SELF_HOSTED_ENABLED:-false}
      AI_SELF_HOSTED_BASE_URL: ${AI_SELF_HOSTED_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_SELF_HOSTED_API_KEY: ${AI_SELF_HOSTED_API_KEY:-}
      AI_SELF_HOSTED_MODEL: ${AI_SELF_HOSTED_MODEL:-qwen3:4b}
      AI_SELF_HOSTED_REQUEST_TIMEOUT: ${AI_SELF_HOSTED_REQUEST_TIMEOUT:-30s}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,chrome-extension://local-dev}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  waypoint-postgres-data:
