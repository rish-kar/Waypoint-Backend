services:
  postgres:
    image: postgres:16
    container_name: waypoint-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - waypoint-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waypoint} -d ${POSTGRES_DB:-waypoint}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: waypoint-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
    container_name: waypoint-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-waypoint}
      DATABASE_USERNAME: ${POSTGRES_USER:-waypoint}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ADMIN_ID: ${ADMIN_ID:-local-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-password-change-me}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      ADMIN_TOTP_ENCRYPTION_KEY: ${ADMIN_TOTP_ENCRYPTION_KEY:-waypoint-local-admin-totp-encryption-key-change-before-production}
      WAYPOINT_ADMIN_EMAIL: ${WAYPOINT_ADMIN_EMAIL:-}
      JWT_SECRET: ${JWT_SECRET:-waypoint-local-development-secret-change-before-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      LEMON_SQUEEZY_API_KEY: ${LEMON_SQUEEZY_API_KEY:-local-lemon-squeezy-api-key}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID:-local-store-id}
      LEMON_SQUEEZY_MONTHLY_VARIANT_ID: ${LEMON_SQUEEZY_MONTHLY_VARIANT_ID:-local-monthly-variant-id}
      LEMON_SQUEEZY_ANNUAL_VARIANT_ID: ${LEMON_SQUEEZY_ANNUAL_VARIANT_ID:-local-annual-variant-id}
      LEMON_SQUEEZY_WEBHOOK_SECRET: ${LEMON_SQUEEZY_WEBHOOK_SECRET:-local-webhook-secret}
      AI_OPENAI_ENABLED: ${AI_OPENAI_ENABLED:-false}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gpt-5-nano}
      AI_OPENAI_REQUEST_TIMEOUT: ${AI_OPENAI_REQUEST_TIMEOUT:-30s}
      AI_BYOK_ENCRYPTION_KEY: ${AI_BYOK_ENCRYPTION_KEY:-d2F5cG9pbnQtYnlvay1kZXYta2V5LTMyLWJ5dGVzISE=}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,chrome-extension://local-dev}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  waypoint-postgres-data: