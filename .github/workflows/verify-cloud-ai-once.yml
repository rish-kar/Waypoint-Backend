name: Final Cloud AI backend verification

on:
  push:
    branches:
      - AI-Integration
    paths:
      - .github/workflows/verify-cloud-ai-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: AI-Integration
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: mvn -B clean verify
      - name: Remove verifier
        shell: bash
        run: |
          rm .github/workflows/verify-cloud-ai-once.yml
          git config user.name "Rishabh Kar"
          git config user.email "46086520+rish-kar@users.noreply.github.com"
          git add -A
          git commit -m "Verify Cloud AI backend integration" || true
          git push origin HEAD:AI-Integration
