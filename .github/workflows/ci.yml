name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Postman collection is synchronized
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python scripts/sync_postman_collection.py
          git diff --exit-code -- postman/Waypoint-Backend.postman_collection.json

      - name: Verify
        run: mvn -B clean verify
