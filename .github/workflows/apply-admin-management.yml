name: Apply Admin Management API

on:
  push:
    paths:
      - '.github/workflows/apply-admin-management.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/Subscription-and-Entitlement'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply admin management implementation
        shell: bash
        run: |
          cat .admin_payload_1.txt .admin_payload_2.txt | base64 -d > /tmp/admin-management.tar.gz
          tar -xzf /tmp/admin-management.tar.gz
          python3 .admin_apply.py
          cat > src/main/java/com/waypoint/backend/model/admin/AdminSubscriptionUpdateRequest.java <<'EOF'
          package com.waypoint.backend.model.admin;

          import com.waypoint.backend.model.subscription.SubscriptionStatus;

          import java.time.Instant;

          public final class AdminSubscriptionUpdateRequest {
              private SubscriptionStatus status;
              private Instant renewsAt;
              private Instant endsAt;
              private boolean clearRenewsAt;
              private boolean clearEndsAt;

              public AdminSubscriptionUpdateRequest() {
              }

              public SubscriptionStatus status() { return status; }
              public Instant renewsAt() { return renewsAt; }
              public Instant endsAt() { return endsAt; }
              public boolean clearRenewsAt() { return clearRenewsAt; }
              public boolean clearEndsAt() { return clearEndsAt; }

              public void setStatus(SubscriptionStatus status) { this.status = status; }
              public void setRenewsAt(Instant renewsAt) { this.renewsAt = renewsAt; }
              public void setEndsAt(Instant endsAt) { this.endsAt = endsAt; }
              public void setClearRenewsAt(boolean clearRenewsAt) { this.clearRenewsAt = clearRenewsAt; }
              public void setClearEndsAt(boolean clearEndsAt) { this.clearEndsAt = clearEndsAt; }
          }
          EOF
          cat > src/main/java/com/waypoint/backend/model/admin/AdminWebhookEventUpdateRequest.java <<'EOF'
          package com.waypoint.backend.model.admin;

          import com.waypoint.backend.model.webhook.ProcessingStatus;

          import java.time.Instant;

          public final class AdminWebhookEventUpdateRequest {
              private ProcessingStatus processingStatus;
              private String errorMessage;
              private Instant processedAt;
              private boolean clearErrorMessage;
              private boolean clearProcessedAt;

              public AdminWebhookEventUpdateRequest() {
              }

              public ProcessingStatus processingStatus() { return processingStatus; }
              public String errorMessage() { return errorMessage; }
              public Instant processedAt() { return processedAt; }
              public boolean clearErrorMessage() { return clearErrorMessage; }
              public boolean clearProcessedAt() { return clearProcessedAt; }

              public void setProcessingStatus(ProcessingStatus processingStatus) { this.processingStatus = processingStatus; }
              public void setErrorMessage(String errorMessage) { this.errorMessage = errorMessage; }
              public void setProcessedAt(Instant processedAt) { this.processedAt = processedAt; }
              public void setClearErrorMessage(boolean clearErrorMessage) { this.clearErrorMessage = clearErrorMessage; }
              public void setClearProcessedAt(boolean clearProcessedAt) { this.clearProcessedAt = clearProcessedAt; }
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/test/java/com/waypoint/backend/AdminDataManagementIntegrationTests.java')
          text = path.read_text()
          text = text.replace(
              'import org.springframework.security.test.web.servlet.request.SecurityMockMvcRequestPostProcessors.HttpBasicRequestPostProcessor;',
              'import org.springframework.test.web.servlet.request.RequestPostProcessor;'
          )
          text = text.replace('private HttpBasicRequestPostProcessor admin()', 'private RequestPostProcessor admin()')
          path.write_text(text)
          PY

      - name: Verify
        run: mvn -B clean verify

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Rishabh Kar"
          git config user.email "46086520+rish-kar@users.noreply.github.com"
          rm .github/workflows/apply-admin-management.yml .admin_payload_1.txt .admin_payload_2.txt .admin_apply.py
          git add -A
          git commit -m "Expand admin data management APIs"
          git push origin HEAD:${GITHUB_REF_NAME}
