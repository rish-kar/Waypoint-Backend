name: Apply Admin Management API

on:
  push:
    paths:
      - '.github/workflows/apply-admin-management.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/Subscription-and-Entitlement'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply admin management implementation
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, tarfile
          data = base64.b64decode('')
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tar:
              tar.extractall('.')
          PY
          python3 .admin_apply.py

      - name: Verify
        run: mvn -B clean verify

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Rishabh Kar"
          git config user.email "46086520+rish-kar@users.noreply.github.com"
          rm .github/workflows/apply-admin-management.yml .admin_apply.py
          git add -A
          git commit -m "Expand admin data management APIs"
          git push origin HEAD:${GITHUB_REF_NAME}
