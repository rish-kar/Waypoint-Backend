name: Sync Postman Once

on:
  push:
    branches:
      - AI-Integration

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate importable Postman collection
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python scripts/sync_postman_collection.py

      - name: Commit synchronized collection
        shell: bash
        run: |
          if git diff --quiet -- postman/Waypoint-Backend.postman_collection.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postman/Waypoint-Backend.postman_collection.json
          git commit -m "Sync Postman collection for GPT-5 nano"
          git push origin HEAD:AI-Integration
