name: One-time layered package restructure

on:
  push:
    branches:
      - Authentication
    paths:
      - ".github/workflows/restructure-layered-packages.yml"
      - "scripts/restructure_layered_packages.py"

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Restructure packages
        run: python3 scripts/restructure_layered_packages.py

      - name: Verify application
        run: mvn -B clean verify

      - name: Commit layered structure
        run: |
          rm scripts/restructure_layered_packages.py
          rm .github/workflows/restructure-layered-packages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restructure backend into layered packages"
          git push origin HEAD:Authentication
