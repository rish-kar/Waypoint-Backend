name: Validate AI integration once

on:
  push:
    branches:
      - AI-Integration
    paths:
      - .github/workflows/validate-ai-integration-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: AI-Integration
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run full Maven verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mvn -B clean verify 2>&1 | tee /tmp/ai-integration-verify.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/ai-integration-verify.exit
          exit "$code"
      - name: Record result
        if: always()
        shell: bash
        run: |
          {
            echo "AI_INTEGRATION_VALIDATION"
            echo "commit=${GITHUB_SHA}"
            echo "exit_code=$(cat /tmp/ai-integration-verify.exit 2>/dev/null || echo missing)"
            echo
            echo "TAIL"
            tail -n 120 /tmp/ai-integration-verify.log 2>/dev/null || true
          } > ai-integration-validation-result.txt
          git config user.name "Rishabh Kar"
          git config user.email "46086520+rish-kar@users.noreply.github.com"
          git add ai-integration-validation-result.txt
          git commit -m "Record AI integration validation result" || true
          git push origin HEAD:AI-Integration
      - name: Fail when Maven verification failed
        if: always()
        run: test "$(cat /tmp/ai-integration-verify.exit 2>/dev/null || echo 1)" = "0"
