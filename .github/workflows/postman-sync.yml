name: Sync Postman Collection

on:
  push:
    branches:
      - Webhooks
    paths:
      - "postman/collections/Waypoint-Backend/**"
      - "scripts/sync_postman_collection.py"
      - ".github/workflows/postman-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: Webhooks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Generate importable Postman collection
        run: python scripts/sync_postman_collection.py

      - name: Commit synchronized collection
        shell: bash
        run: |
          if git diff --quiet -- postman/Waypoint-Backend.postman_collection.json; then
            echo "Postman collection already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postman/Waypoint-Backend.postman_collection.json
          git commit -m "Sync importable Postman collection"
          git push origin HEAD:Webhooks
