name: Sync Microsoft OAuth Postman Collection

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  sync-postman:
    if: github.head_ref == 'Microsoft-OAuth' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out Microsoft OAuth branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Regenerate main Postman collection
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python scripts/sync_postman_collection.py

      - name: Commit regenerated collection
        run: |
          if git diff --quiet -- postman/Waypoint-Backend.postman_collection.json; then
            echo 'Main Postman collection is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add postman/Waypoint-Backend.postman_collection.json
          git commit -m 'Sync Microsoft OAuth into main Postman collection'
          git push origin HEAD:${{ github.head_ref }}
