name: Apply Cloud AI conversation fix

on:
  push:
    branches:
      - AI-Integration
    paths:
      - .github/workflows/apply-cloud-chat-fix-once.yml
      - scripts/apply-cloud-chat-fix-once.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: AI-Integration
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply Cloud AI conversation fix
        run: python3 scripts/apply-cloud-chat-fix-once.py
      - name: Remove one-off helpers
        run: rm scripts/apply-cloud-chat-fix-once.py .github/workflows/apply-cloud-chat-fix-once.yml
      - name: Verify backend
        run: mvn -B clean verify
      - name: Commit verified backend integration
        shell: bash
        run: |
          git config user.name "Rishabh Kar"
          git config user.email "46086520+rish-kar@users.noreply.github.com"
          git add -A
          git commit -m "Add Cloud AI page conversations" || true
          git push origin HEAD:AI-Integration

# Triggered after workflow registration.
