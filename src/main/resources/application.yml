spring:
  application:
    name: Waypoint-Backend
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

admin:
  id: ${ADMIN_ID:}
  password: ${ADMIN_PASSWORD:}
  totp-secret: ${ADMIN_TOTP_SECRET:}
  totp-encryption-key: ${ADMIN_TOTP_ENCRYPTION_KEY:waypoint-local-admin-totp-encryption-key-change-before-production}

jwt:
  secret: ${JWT_SECRET:}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

security:
  distributed-state-enabled: false

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  token-info-url: ${GOOGLE_TOKEN_INFO_URL:https://oauth2.googleapis.com/tokeninfo}
  user-info-url: ${GOOGLE_USER_INFO_URL:https://openidconnect.googleapis.com/v1/userinfo}

google-oauth:
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  authorization-url: ${GOOGLE_AUTHORIZATION_URL:https://accounts.google.com/o/oauth2/v2/auth}
  token-url: ${GOOGLE_TOKEN_URL:https://oauth2.googleapis.com/token}

lemon-squeezy:
  api-key: ${LEMON_SQUEEZY_API_KEY:}
  store-id: ${LEMON_SQUEEZY_STORE_ID:}
  monthly-variant-id: ${LEMON_SQUEEZY_MONTHLY_VARIANT_ID:}
  annual-variant-id: ${LEMON_SQUEEZY_ANNUAL_VARIANT_ID:}
  webhook-secret: ${LEMON_SQUEEZY_WEBHOOK_SECRET:}
  api-base-url: ${LEMON_SQUEEZY_API_BASE_URL:https://api.lemonsqueezy.com/v1}

ai:
  openai:
    enabled: ${AI_OPENAI_ENABLED:false}
    base-url: ${AI_OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${AI_OPENAI_MODEL:gpt-5-nano}
    request-timeout: ${AI_OPENAI_REQUEST_TIMEOUT:30s}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

app:
  base-url: ${APP_BASE_URL:}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.waypoint.backend: ${LOG_LEVEL_WAYPOINT:INFO}
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
