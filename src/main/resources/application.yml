spring:
  application:
    name: Waypoint-Backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/waypoint}
    username: ${DATABASE_USERNAME:waypoint}
    password: ${DATABASE_PASSWORD:waypoint}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  secret: ${JWT_SECRET:}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  token-info-url: https://oauth2.googleapis.com/tokeninfo
  user-info-url: https://www.googleapis.com/oauth2/v3/userinfo

lemon-squeezy:
  api-key: ${LEMON_SQUEEZY_API_KEY:}
  store-id: ${LEMON_SQUEEZY_STORE_ID:}
  monthly-variant-id: ${LEMON_SQUEEZY_MONTHLY_VARIANT_ID:}
  annual-variant-id: ${LEMON_SQUEEZY_ANNUAL_VARIANT_ID:}
  webhook-secret: ${LEMON_SQUEEZY_WEBHOOK_SECRET:}
  api-base-url: https://api.lemonsqueezy.com/v1

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,chrome-extension://local-dev}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
