spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:20}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:5}
  data:
    redis:
      url: ${REDIS_URL}

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

security:
  distributed-state-enabled: true

google:
  client-id: ${GOOGLE_CLIENT_ID}

microsoft:
  client-id: ${MICROSOFT_CLIENT_ID}
  client-secret: ${MICROSOFT_CLIENT_SECRET}
  tenant: ${MICROSOFT_TENANT:common}
  callback-url: ${MICROSOFT_CALLBACK_URL}
  graph-user-url: ${MICROSOFT_GRAPH_USER_URL:https://graph.microsoft.com/v1.0/me?$select=id,displayName,mail,userPrincipalName}
  token-encryption-key: ${MICROSOFT_TOKEN_ENCRYPTION_KEY}
  allowed-extension-redirect-uris: ${MICROSOFT_ALLOWED_EXTENSION_REDIRECT_URIS}
  transaction-ttl-seconds: ${MICROSOFT_TRANSACTION_TTL_SECONDS:600}
  exchange-code-ttl-seconds: ${MICROSOFT_EXCHANGE_CODE_TTL_SECONDS:180}

lemon-squeezy:
  api-key: ${LEMON_SQUEEZY_API_KEY}
  store-id: ${LEMON_SQUEEZY_STORE_ID}
  monthly-variant-id: ${LEMON_SQUEEZY_MONTHLY_VARIANT_ID}
  annual-variant-id: ${LEMON_SQUEEZY_ANNUAL_VARIANT_ID}
  webhook-secret: ${LEMON_SQUEEZY_WEBHOOK_SECRET}
  reconciliation-enabled: ${LEMON_SQUEEZY_RECONCILIATION_ENABLED:true}
  reconciliation-initial-delay-ms: ${LEMON_SQUEEZY_RECONCILIATION_INITIAL_DELAY_MS:60000}
  reconciliation-interval-ms: ${LEMON_SQUEEZY_RECONCILIATION_INTERVAL_MS:900000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  base-url: ${APP_BASE_URL}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.waypoint.backend: ${LOG_LEVEL_WAYPOINT:INFO}
