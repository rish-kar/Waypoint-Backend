spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:20}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:5}

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

google:
  client-id: ${GOOGLE_CLIENT_ID}

lemon-squeezy:
  api-key: ${LEMON_SQUEEZY_API_KEY}
  store-id: ${LEMON_SQUEEZY_STORE_ID}
  monthly-variant-id: ${LEMON_SQUEEZY_MONTHLY_VARIANT_ID}
  annual-variant-id: ${LEMON_SQUEEZY_ANNUAL_VARIANT_ID}
  webhook-secret: ${LEMON_SQUEEZY_WEBHOOK_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  base-url: ${APP_BASE_URL}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.waypoint.backend: ${LOG_LEVEL_WAYPOINT:INFO}
